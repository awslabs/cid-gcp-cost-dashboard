dashboards:
  'GCP COST DASHBOARD':
    dependsOn:
      datasets:
      - gcp_currency
      - gcp_summary_with_pricing
    name: 'GCP Cost Dashboard '
    dashboardId: gcp-cost-dashboard
    category: Custom
    data: |-
      AnalysisDefaults:
        DefaultNewSheetConfiguration:
          InteractiveLayoutConfiguration:
            Grid:
              CanvasSizeOptions:
                ScreenCanvasSizeOptions:
                  OptimizedViewPortWidth: 1600px
                  ResizeOption: FIXED
          SheetContentType: INTERACTIVE
      CalculatedFields:
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: ' sum(abs({ee76f686-7be4-4959-bd9f-20a6942d2145.credits_amount})) /
          sum(cost)'
        Name: '% of credits'
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split(split({sku_description}, 'Cloud SQL for ', 2),':', 1)
        Name: Cloud SQL Engine
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: cost + {credits total}
        Name: Cost After Credits
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {Cost After Credits}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Cost After Credits in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: sum({Default Cost}) / sum(cores)
        Name: Cost Per Core
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          cost
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
             1
          )
        Name: Cost in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {credits_commited_usage_discount_amount}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Credits Commited in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {credits_discount_amount}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Credits Discount in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {credits_free_tier_amount}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Credits FreeTier in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {credits_promotion_amount}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Credits Promotion in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {credits_sustained_usage_discount_amount}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Credits Sustained in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: "// https://cloud.google.com/billing/docs/resources/currency#list_of_countries_and_regions\n\
          ifelse(\n    ${Currency} = 'USD', '$',\n    ${Currency} = 'EUR', '\u20AC',\n \
          \   ${Currency} = 'NOK', 'kr',\n    ${Currency} = 'BRL', 'R$',\n    ${Currency}\
          \ = 'CAD', 'C$',\n    ${Currency} = 'CZK', 'K\u010D',\n    ${Currency} = 'DKK',\
          \ 'kr',\n    ${Currency} = 'HKD', 'HK$',\n    ${Currency} = 'INR', '\u20B9',\n\
          \    ${Currency} = 'IDR', 'Rp',\n    ${Currency} = 'ILS', '\u20AA',\n    ${Currency}\
          \ = 'JPY', '\xA5',\n    ${Currency} = 'CHF', 'CHF',\n    ${Currency} = 'MYR',\
          \ 'RM',\n    ${Currency} = 'MXN', '$',\n    ${Currency} = 'NZD', '$',\n    ${Currency}\
          \ = 'PLN', 'z\u0142',\n    ${Currency} = 'RUB', '\u20BD',\n    ${Currency} = 'SGD',\
          \ 'S$',\n    ${Currency} = 'KRW', '\u20A9',\n    ${Currency} = 'SEK', 'kr',\n\
          \    ${Currency} = 'TWD', 'NT$',\n    ${Currency} = 'THB', '\u0E3F',\n    ${Currency}\
          \ = 'TRY', '\u20BA',\n    ${Currency} = 'GBP', '\xA3',\n    ${Currency} = 'VND',\
          \ '\u20AB',\n    ${Currency}\n)"
        Name: Currency Sign
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
              ${CostType} = 'Cost', cost ,
              ${CostType} = 'Cost After Credits', {Cost After Credits},
              0
          )
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Default Cost
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: (sum(cost) - sum({Cost After Credits}))/ sum(cost)
        Name: Discount, %
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
              ${GroupBy} = 'Billing Account Id', {billing_account_id},
              ${GroupBy} = 'Project L1', {project_level_1},
              ${GroupBy} = 'Project L2', {project_level_2},
              ${GroupBy} = 'Project L2', {project_level_3},
              ${GroupBy} = 'Project L3', {project_level_4},
              ${GroupBy} = 'Project L4', {project_level_5},
              ${GroupBy} = 'Project L5', {project_level_6},
              ${GroupBy} = 'Project L6', {project_level_1},
              ${GroupBy} = 'Project Name', {project_name},
              'All'
          )
        Name: Group By
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
              isNull({project_level_1}), 'Global',
              ${MaxLevel} = 'L1', {project_level_1},
              ${MaxLevel} = 'L2', concat({project_level_1}, ' > ', {project_level_2}),
              ${MaxLevel} = 'L3', concat({project_level_1}, ' > ', {project_level_2}, ' > ', {project_level_3}),
              ${MaxLevel} = 'L4', concat({project_level_1}, ' > ', {project_level_2}, ' > ', {project_level_3}, ' > ', {project_level_4}),
              ${MaxLevel} = 'L5', concat({project_level_1}, ' > ', {project_level_2}, ' > ', {project_level_3}, ' > ', {project_level_4}, ' > ', {project_level_5}),
              ${MaxLevel} = 'L6', concat({project_level_1}, ' > ', {project_level_2}, ' > ', {project_level_3}, ' > ', {project_level_4}, ' > ', {project_level_5}, ' > ', {project_level_6}),
              "ERROR"
          )
        Name: Level
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
              {Sku Sub Type} = 'Licensing Fee', split(split(split({sku_description}, ' for ', 2), ' (',  1), ' on ', 1),
              NULL
          )
        Name: Licensing For
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '{system_labels_memory int} / 24 / 1000 / 1000/ 1000'
        Name: Memory Daily, TB
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: percentDifference(sum({Default Cost}), [{invoice_month} ASC ], -1, [Product])
        Name: MoM % Service
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          percentDifference(
              sum({Default Cost}),
              [ {invoice_month} ASC],
              -1,
              [Level]
          )
        Name: MoM % per Project
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: difference(sum({Default Cost}), [{invoice_month} ASC ], -1, [Product])
        Name: MoM By Service
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          difference(
              sum({Default Cost}),
              [ {invoice_month} ASC],
              -1,
              [Level]
          )
        Name: MoM per Project
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: -{Credits Sustained in Currency}
        Name: Positive Credits Sustained in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: ( {Positive Credits Sustained in Currency} / 0.3) * 0.5 - {Positive
          Credits Sustained in Currency}
        Name: 'Potential Additional Commitement Savings '
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
              {sku_description} = 'Private private-offer subscription', "Private Offer",
              "Regular"
          )
        Name: Private Offer
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
            ${MaxProductLevel} = 'P1', ifelse(isNull({Product Taxonomy 1}), 'Undef', {Product Taxonomy 1}),
            ${MaxProductLevel} = 'P2', concat(ifelse(isNull({Product Taxonomy 1}), 'Undef', {Product Taxonomy 1}), ' > ', {Product Taxonomy 2} ),
            ${MaxProductLevel} = 'P3', concat(ifelse(isNull({Product Taxonomy 1}), 'Undef', {Product Taxonomy 1}), ' > ', {Product Taxonomy 2}, ' > ', {Product Taxonomy 3} ),
            ${MaxProductLevel} = 'P4', concat(ifelse(isNull({Product Taxonomy 1}), 'Undef', {Product Taxonomy 1}), ' > ', {Product Taxonomy 2}, ' > ', {Product Taxonomy 3}, ' > ', {Product Taxonomy 4} ),
            ${MaxProductLevel} = 'P5', concat(ifelse(isNull({Product Taxonomy 1}), 'Undef', {Product Taxonomy 1}), ' > ', {Product Taxonomy 2}, ' > ', {Product Taxonomy 3}, ' > ', {Product Taxonomy 4}, ' > ', {Product Taxonomy 5} ),
            ${MaxProductLevel} = 'P6', concat(ifelse(isNull({Product Taxonomy 1}), 'Undef', {Product Taxonomy 1}), ' > ', {Product Taxonomy 2}, ' > ', {Product Taxonomy 3}, ' > ', {Product Taxonomy 4}, ' > ', {Product Taxonomy 5}, ' > ', {Product Taxonomy 6} ),
            ${MaxProductLevel} = 'Service', Service,
            'Undef'
          )
        Name: Product
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '"product taxonomy"'
        Name: Product Taxonomy 1
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '"product taxonomy"'
        Name: Product Taxonomy 2
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '"product taxonomy"'
        Name: Product Taxonomy 3
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '"product taxonomy"'
        Name: Product Taxonomy 4
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '"product taxonomy"'
        Name: Product Taxonomy 5
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '"product taxonomy"'
        Name: Product Taxonomy 6
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
             {service_description} = 'Invoice' AND {cost_type} = 'tax', 'Invoice Tax',
             {service_description} = 'Invoice' AND {cost_type} = 'adjustment', 'Invoice Adjustment',
             {service_description}
          )
        Name: Service
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
             locate( {sku_description}, 'Network Intelligence Center', 1) > 0, 'Intelligence Center',
             locate( {sku_description}, 'Network Inter Region Egress', 1) > 0, 'Inter Region Egress ',
             locate( {sku_description}, 'Network Inter Zone Egress', 1) > 0,   'Inter Zone Egress',
             locate( {sku_description}, 'Network Internal Load Balancing', 1) > 0, 'Internal Load Balancing',
             locate( {sku_description}, 'Network Internet Egress', 1) > 0,         'Internet Egress',
             locate( {sku_description}, 'Network Load Balancing', 1) > 0, 'Load Balancing',
             locate( {sku_description}, 'Network Vpn', 1) > 0, 'Vpn',
             locate( {sku_description}, 'Networking Data Transfer', 1) > 0, 'Data Transfer',
             locate( {sku_description}, 'Networking Cloud Armor', 1) > 0, 'Cloud Armor',
             locate( {sku_description}, 'Networking Network Connectivity Center', 1) > 0, 'Connectivity Center',
             locate( {sku_description}, 'Networking Cloud VPN', 1) > 0, 'Networking Cloud VPN',
             locate( {sku_description}, 'Network ', 1) > 0, 'Network',
             locate( {sku_description}, 'Licensing Fee', 1) > 0, 'Licensing Fee',
             locate( {sku_description}, 'Spot Preemptible', 1) > 0, 'Spot Preemptible',
             locate( {sku_description}, 'Commitment v1:', 1) > 0, 'Commitment v1',
             locate( {sku_description}, 'Reserved Memory', 1) > 0, 'Compute',
             locate( {sku_description}, 'Compute optimized', 1) > 0, 'Compute',
             locate( {sku_description}, 'Custom Instance', 1) > 0, 'Compute',
             locate( {sku_description}, 'Custom Extended Instance', 1) > 0, 'Compute',
             locate( {sku_description}, ' Instance ', 1) > 0, 'Compute',
             {sku_description}
          )
        Name: Sku Sub Type
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse(
           locate({sku_description}, ' Cpu ', 1) > 0, 'CPU',
           locate({sku_description}, ' Core ', 1) > 0, 'CPU',
           locate({sku_description}, ' Cpu ', 1) > 0, 'CPU',
           locate({sku_description}, ' Memory ', 1) > 0, 'RAM',
           locate({sku_description}, ' Ram ', 1) > 0, 'RAM',
           {Sku Sub Type} = 'Licensing Fee', split(split(split({sku_description}, ' for ', 2), ' (',  1), ' on ', 1),
           'Other'
          )
        Name: Sku Sub Type 2
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: extract('HH', {usage_start_time})
        Name: Start Hour
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          {credits total}
          *
          ifelse(
              ${Currency} = 'USD', {currency_conversion_rate} ,
              1
          )
        Name: Total Credits in Currency
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: parseDecimal({system_labels_cores})
        Name: cores
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          ifelse( {credits_promotion_amount}< 0, {credits_promotion_amount}, 0 )
          + ifelse( {credits_commited_usage_discount_amount} < 0, {credits_commited_usage_discount_amount} , 0 )
          + ifelse( {credits_sustained_usage_discount_amount} < 0, {credits_sustained_usage_discount_amount} , 0 )
          + ifelse( {credits_free_tier_amount}< 0, {credits_free_tier_amount}, 0 )
          + ifelse( {credits_discount_amount}< 0, {credits_discount_amount}, 0 )
          + ifelse( {credits_promotion_amount}> 0, {credits_promotion_amount}, 0 )
          + ifelse( {credits_commited_usage_discount_amount} > 0, {credits_commited_usage_discount_amount} , 0 )
          + ifelse( {credits_sustained_usage_discount_amount} > 0, {credits_sustained_usage_discount_amount} , 0 )
          + ifelse( {credits_free_tier_amount}> 0, {credits_free_tier_amount}, 0 )
          + ifelse( {credits_discount_amount}> 0, {credits_discount_amount}, 0 )
        Name: credits total
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split(split({sku_description}, ' from ', 2), ' to ', 1)
        Name: from
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: '- ({ee76f686-7be4-4959-bd9f-20a6942d2145.credits_commited_usage_discount}
          + {ee76f686-7be4-4959-bd9f-20a6942d2145.credits_sustained_usage_discount} + {ee76f686-7be4-4959-bd9f-20a6942d2145.credits_other_discount_amount1}  +
          {ee76f686-7be4-4959-bd9f-20a6942d2145.credits_other_discount_amount2})'
        Name: pos credit amount
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split({project_ancestors}, '/', 2)
        Name: project l2
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split({project_ancestors}, '/', 3)
        Name: project l3
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split({project_ancestors}, '/', 4 )
        Name: project l4
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split({project_ancestors}, '/', 5)
        Name: project l5
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: |-
          "main"
        Name: project_l1
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split({location_region},'-', 1 )
        Name: region
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: "ifelse(\n{location_region} = 'asia-east1', 'Changhua County, Taiwan,\
          \ APAC',\n{location_region} = 'asia-east2', 'Hong Kong, APAC',\n{location_region}\
          \ = 'asia-northeast1', 'Tokyo, Japan, APAC',\n{location_region} = 'asia-northeast2',\
          \ 'Osaka, Japan, APAC',\n{location_region} = 'asia-northeast3', 'Seoul, South\
          \ Korea, APAC',\n{location_region} = 'asia-south1', 'Mumbai, India APAC',\n{location_region}\
          \ = 'asia-south2', 'Delhi, India APAC',\n{location_region} = 'asia-southeast1',\
          \ 'Jurong West, Singapore, APAC',\n{location_region} = 'asia-southeast2', 'Jakarta,\
          \ Indonesia, APAC',\n{location_region} = 'australia-southeast1', 'Sydney, Australia,\
          \ APAC',\n{location_region} = 'australia-southeast2', 'Melbourne, Australia, APAC',\n\
          {location_region} = 'europe-central2', 'Warsaw, Poland, Europe',\n{location_region}\
          \ = 'europe-north1', 'Hamina, Finland, Europe',\n{location_region} = 'europe-southwest1',\
          \ 'Madrid, Spain, Europe',\n{location_region} = 'europe-west1', 'St. Ghislain,\
          \ Belgium, Europe',\n{location_region} = 'europe-west12', 'Turin, Italy, Europe',\n\
          {location_region} = 'europe-west2', 'London, England, Europe',\n{location_region}\
          \ = 'europe-west3', 'Frankfurt, Germany Europe',\n{location_region} = 'europe-west4',\
          \ 'Eemshaven, Netherlands, Europe',\n{location_region} = 'europe-west6', 'Zurich,\
          \ Switzerland, Europe',\n{location_region} = 'europe-west8', 'Milan, Italy, Europe',\n\
          {location_region} = 'europe-west9', 'Paris, France, Europe',\n{location_region}\
          \ = 'me-central1', 'Doha, Qatar, Middle East',\n{location_region} = 'me-west1',\
          \ 'Tel Aviv, Israel, Middle East',\n{location_region} = 'northamerica-northeast1',\
          \ 'Montr\xE9al, Qu\xE9bec, North America',\n{location_region} = 'northamerica-northeast2',\
          \ 'Toronto, Ontario, North America',\n{location_region} = 'southamerica-east1',\
          \ 'Osasco, S\xE3o Paulo, Brazil, South America',\n{location_region} = 'southamerica-west1',\
          \ 'Santiago, Chile, South America',\n{location_region} = 'us-central1', 'Council\
          \ Bluffs, Iowa, North America',\n{location_region} = 'us-east1', 'Moncks Corner,\
          \ South Carolina, North America',\n{location_region} = 'us-east4', 'Ashburn, Virginia,\
          \ North America',\n{location_region} = 'us-east5', 'Columbus, Ohio, North America',\n\
          {location_region} = 'us-south1', 'Dallas, Texas, North America',\n{location_region}\
          \ = 'us-west1', 'The Dalles, Oregon, North America',\n{location_region} = 'us-west2',\
          \ 'Los Angeles, California, North America',\n{location_region} = 'us-west3', 'Salt\
          \ Lake City, Utah, North America',\n{location_region} = 'us-west4', 'Las Vegas,\
          \ Nevada, North America',\n{location_region}\n)"
        Name: region name
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: parseDecimal({system_labels_memory})
        Name: system_labels_memory int
      - DataSetIdentifier: gcp_summary_with_pricing
        Expression: split({sku_description}, ' to ', 2)
        Name: to
      ColumnConfigurations:
      - Column:
          ColumnName: '% of credits'
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              PercentageDisplayFormatConfiguration:
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: Cost After Credits
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: Cost After Credits in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
                SeparatorConfiguration:
                  DecimalSeparator: DOT
                  ThousandsSeparator:
                    Symbol: SPACE
      - Column:
          ColumnName: Cost in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Credits Commited in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Credits Discount in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Credits FreeTier in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Credits Promotion in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Credits Sustained in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Default Cost
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: Discount, %
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              PercentageDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: MoM % Service
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              PercentageDisplayFormatConfiguration:
                NegativeValueConfiguration:
                  DisplayMode: NEGATIVE
                NullValueFormatConfiguration:
                  NullString: 'null'
                SeparatorConfiguration:
                  DecimalSeparator: DOT
                  ThousandsSeparator:
                    Symbol: COMMA
                    Visibility: VISIBLE
                Suffix: '%'
      - Column:
          ColumnName: Total Credits in Currency
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                DecimalPlacesConfiguration:
                  DecimalPlaces: 0
                NullValueFormatConfiguration:
                  NullString: 'null'
                NumberScale: AUTO
      - Column:
          ColumnName: cost
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: credits total
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              CurrencyDisplayFormatConfiguration:
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: credits_commited_usage_discount_amount
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              CurrencyDisplayFormatConfiguration:
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: credits_discount_amount
          DataSetIdentifier: gcp_summary_with_pricing
        FormatConfiguration:
          NumberFormatConfiguration:
            FormatConfiguration:
              NumberDisplayFormatConfiguration:
                NullValueFormatConfiguration:
                  NullString: 'null'
      - Column:
          ColumnName: credits_free_tier_amount
          DataSetIdentifier: gcp_summary_with_pricing
